name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --help
      - name: shared-checkout hook regression test
        run: bash tests/hook.test.sh

  mod:
    name: session-agents mod
    runs-on: ubuntu-latest
    # `claude plugin validate|test` run offline once the CLI is installed; proven on run 39390316230.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/session-agents
      - run: claude plugin test plugins/session-agents
